name: registro

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: registro
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Anotar as posicoes
        run: python3 wallets_forward.py --tick
      - name: Conferir a cadeia
        run: python3 wallets_forward.py --verify
      - name: Gravar no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -q -m "registro $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q
